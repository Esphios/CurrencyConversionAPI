services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${CURRENCY_API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CurrencyConverter__EcbRatesUrl: "${ECB_RATES_URL:-https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
          IFS= read -r status <&3 && [[ "$${status}" == *" 200 "* ]]'
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
